plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Web dependency for building REST APIs
	implementation 'org.springframework.boot:spring-boot-starter'

	// Manual JSON Creation dependency added in Spring Boot Web
	implementation group: 'org.json', name: 'json', version: '20250107'

	// Spring Boot Web dependency for building REST APIs
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Boot DevTools for development convenience (optional)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// JPA and Database support (optional, if you're using a database)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// MYSQL Connector added here
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Spring Boot Test (optional for unit/integration testing)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
